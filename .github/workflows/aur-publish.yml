name: Publish to AUR

# 本机网络无法直连 aur ssh (22 端口被断), 由 GHA 境外 runner 代推
# 触发方式: 手动 (workflow_dispatch), 需配置仓库 secret: AUR_SSH_PRIVATE_KEY
on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "AUR 提交说明"
        required: false
        default: "alltap 1.2.1-1"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish PKGBUILD to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          COMMIT_MSG: ${{ github.event.inputs.commit_message }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          git clone ssh://aur@aur.archlinux.org/alltap.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo

          git config user.name "kane250"
          git config user.email "109224821+kane250@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR 内容无变化, 跳过推送"
          else
            git commit -m "${COMMIT_MSG:-update}"
            git push
            echo "=== 已推送到 AUR ==="
          fi
