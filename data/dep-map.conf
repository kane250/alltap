# =====================================================================
# alltap 依赖映射数据库
# 语法:
#   原包名 => Arch包名        # 精确匹配
#   原包名 =>                 # 置空表示"直接丢弃该依赖"(发行版基础设施)
#   @regex 正则 => Arch包名    # 正则匹配 (re.match, 从头匹配)
#   @drop 名1 名2 ...          # 批量丢弃
# 适用范围: deb / rpm / apk / slackware 的依赖统一走本表 + Arch 仓库同名匹配 +
#           启发式规则 (lib前缀剥离、soname数字剥离、-dev后缀剥离)
# =====================================================================

